name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show deps
        run: ls -la libs/

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4G"

      - name: Collect jar
        run: |
          mkdir -p out
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} out/ \;
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcxaero-jar
          path: out/*.jar
          if-no-files-found: error
