modLoader = "kotlinforforge"
loaderVersion = "[4,)"
license = "LGPL-3.0-or-later"
issueTrackerURL = "https://github.com/gus559445/touchcontroller-xaero/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "tcxaero"
description = '''把 Xaero's Minimap 的小地图接成 TouchController 的一个控件：在 TC 的布局编辑器里拖动这个控件，小地图就跟着走。'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1]"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "kotlinforforge"
mandatory = true
versionRange = "[4,)"
ordering = "NONE"
side = "CLIENT"

# TouchController 必须在之前加载：控件注册表由它静态初始化建立。
#
# 注意 modId 用的是 touchcontroller_1_20_1 而不是 touchcontroller：
# TC 0.3.1 是 multijar 打包，它的 LegacyModLocator.scanCandidates() 返回空流，
# 只靠构造函数的副作用把 META-INF/jars/*.jar 注册成独立 mod，
# 外层那个 modId="touchcontroller" 的 mods.toml 在 Forge 1.20.1 上根本不会被读到。
# 所以运行时真正存在的 id 是 touchcontroller_1_20_1。
#
# 版本范围不能写 [0.3.1,)：TC 目前发布的是 0.3.1-alphaNN，
# 按 Maven 版本语义 alpha 预发布小于正式版，[0.3.1,) 会把 0.3.1-alpha17 判为不满足。
# 这里取 [0.3,1.0)，既容纳所有 0.3.x 预发布，也不会误配 0.2.x。
[[dependencies.${mod_id}]]
modId = "touchcontroller_1_20_1"
mandatory = true
versionRange = "[0.3,1.0)"
ordering = "AFTER"
side = "CLIENT"

# Xaero's Minimap 可选：没装也能启动，只是控件不会驱动任何东西。
[[dependencies.${mod_id}]]
modId = "xaerominimap"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
