modLoader = "kotlinforforge"
loaderVersion = "[4,)"
license = "LGPL-3.0-or-later"
issueTrackerURL = "https://github.com/gus559445/TouchController-/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "tcxaero"
description = '''把 Xaero's Minimap 的小地图接成 TouchController 的一个控件：在 TC 的布局编辑器里拖动这个控件，小地图就跟着走。'''

[[dependencies.${mod_id}]]
modId = "forge"
type = "required"
versionRange = "[47,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.20.1]"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "kotlinforforge"
type = "required"
versionRange = "[4,)"
ordering = "NONE"
side = "CLIENT"

# TouchController 必须在之前加载：控件注册表由它静态初始化建立。
[[dependencies.${mod_id}]]
modId = "touchcontroller"
type = "required"
versionRange = "[0.3.1,)"
ordering = "AFTER"
side = "CLIENT"

# Xaero's Minimap 可选：没装也能启动，只是控件不会驱动任何东西。
[[dependencies.${mod_id}]]
modId = "xaerominimap"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
